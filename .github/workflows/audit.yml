name: Audit

# Known-vulnerability check on every push, and daily: new advisories appear without code changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * *"  # 08:30 in Bangladesh
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (exact pins, runtime and dev)
        run: pip-audit --progress-spinner off -r backend/requirements.txt -r backend/requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Code that ships to the browser and server must be clean
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build tools (eslint, shadcn CLI, openapi-typescript) must have nothing high or critical
        run: npm audit --audit-level=high
