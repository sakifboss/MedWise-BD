name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04  # Python 3.11.9 (same as Render) has no build for 26.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: medwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Only the listed packages, at the listed versions: if a pin is missing or clashes,
      # pip check fails here instead of Render quietly installing something else.
      - name: Install pinned dependencies
        run: pip install --no-deps -r requirements-dev.txt && pip check
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate seed data
        run: python scripts/import_data.py --dry-run
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/medwise

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack (Postgres, backend, frontend)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test through the frontend
        run: |
          curl --fail --silent http://localhost:3000/ > /dev/null
          curl --fail --silent http://localhost:3000/api/health | grep '"database":"ok"'
          curl --fail --silent "http://localhost:3000/api/search?q=napa" | grep '"Napa"'
          # Prescription reading is locked to the frontend: a direct call to the backend is refused.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:8000/api/prescription)" = 403
          # Through the frontend the secret is added, so the request gets past the check. (It then stops
          # with 503 "not configured", since CI has no Gemini key; anything but 403 means it got through.)
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:3000/api/prescription)" != 403
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down
