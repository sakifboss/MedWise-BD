# Alembic: migrations for the durable tables only (RequestsBase: medicine_requests, data_reports;
# doctor tables later). Seed tables are rebuilt by scripts/import_data.py on every deploy.
# import_data.py runs `upgrade head` itself; by hand, from backend/: alembic upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
